<!DOCTYPE html>
<!--
  ローカルサーバー経由で開いてください。fetch を使うため file:// では動きません。
  リポジトリのルートで:  python3 -m http.server
  → http://localhost:8000/examples/svg-choropleth.html
-->
<!--
  「値の算出は data/japan.grid.json、地図の描画は dist/*.svg」という
  このリポジトリの想定どおりの組み合わせのサンプルです。
  題材は県名の画数合計。地図の塗り分け方を示すための無害な例で、
  何かの優劣を表すものではありません。
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<title>県名の画数合計を塗り分ける例</title>
<style>
  body { font-family: "IPAGothic", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif; background: #fff; color: #333; }
  #title { text-align: center; margin: 2rem 0 0; font-size: 1.1rem; }
  #wrap { width: min(90vmin, 700px); margin: .5rem auto; }
  #wrap svg { width: 100%; height: auto; }
  #wrap path { transition: fill .15s; }
  #legend { display: flex; flex-wrap: wrap; gap: .9rem; justify-content: center;
            margin: 0 auto 1rem; font-size: .85rem; }
  #legend span { display: flex; align-items: center; gap: .35rem; }
  #legend i { width: 1rem; height: 1rem; border-radius: 3px; }
  #note { text-align: center; font-size: .8rem; color: #777; }
  #wrap text { font-weight: 700; font-size: 7.5px; text-anchor: middle; pointer-events: none; }
</style>
</head>
<body>
<h1 id="title">県名の画数合計</h1>
<div id="wrap"></div>
<div id="legend"></div>
<p id="note">県名を直接置いているので、地理に詳しくなくてもどこがどの県か分かります</p>
<script>
// 県名に使われる漢字の画数
const STROKES = {
  "北":5,  "海":9,  "道":12, "青":8,  "森":12, "県":9,  "岩":8,  "手":4,  "宮":10, "城":9,
  "秋":9,  "田":5,  "山":3,  "形":7,  "福":13, "島":10, "茨":9,  "栃":9,  "木":4,  "群":13,
  "馬":10, "埼":11, "玉":5,  "千":3,  "葉":12, "東":8,  "京":8,  "都":11, "神":9,  "奈":8,
  "川":3,  "新":13, "潟":15, "富":12, "石":5,  "井":4,  "梨":11, "長":8,  "野":11, "岐":7,
  "阜":8,  "静":14, "岡":8,  "愛":13, "知":8,  "三":3,  "重":9,  "滋":12, "賀":12, "府":8,
  "大":3,  "阪":7,  "兵":7,  "庫":10, "良":7,  "和":8,  "歌":14, "鳥":11, "取":8,  "根":10,
  "広":5,  "口":3,  "徳":14, "香":9,  "媛":12, "高":10, "佐":7,  "崎":11, "熊":14, "本":5,
  "分":4,  "鹿":11, "児":7,  "沖":7,  "縄":15,
};

// 区分の定義。塗りと凡例を同じ定義から作る。
// 境界値は四分位（各区分の県数がほぼ揃う位置）で決めた。
// 実データは最大値までを等分割すると大半が最小区分に寄るので、この決め方が無難。
const CLASSES = [
  { min: 30, color: "#A63A2E", ink: "#FFFFFF", label: "30画以上" },
  { min: 27, color: "#D2604B", ink: "#FFFFFF", label: "27〜29画" },
  { min: 23, color: "#E88A6B", ink: "#333333", label: "23〜26画" },
  { min:  0, color: "#F5B090", ink: "#333333", label: "22画以下" },
];

Promise.all([
  fetch("../data/japan.grid.json").then(r => r.json()),
  fetch("../dist/japan-rounded.svg").then(r => r.text()),
]).then(([grid, svg]) => {
  document.getElementById("wrap").innerHTML = svg;

  // 各県のセル範囲＝ラベル位置。全県が矩形なので中心は必ずその県の内側に入る。
  const box = {};
  grid.rows.forEach((row, r) => [...row].forEach((ch, c) => {
    if (ch === ".") return;
    const b = box[ch] ||= { x0: c, x1: c, y0: r, y1: r };
    b.x0 = Math.min(b.x0, c); b.x1 = Math.max(b.x1, c);
    b.y0 = Math.min(b.y0, r); b.y1 = Math.max(b.y1, r);
  }));

  const svgEl = document.querySelector("#wrap svg");
  const NS = "http://www.w3.org/2000/svg";
  const shortName = n => n === "北海道" ? n : n.replace(/[都府県]$/, "");

  for (const [ch, pref] of Object.entries(grid.legend)) {
    const strokes = [...pref.name].reduce((n, k) => n + STROKES[k], 0);
    const cls = CLASSES.find(c => strokes >= c.min);

    const path = document.getElementById("JP-" + pref.code);
    path.setAttribute("fill", cls.color);
    path.querySelector("title").textContent = `${pref.name} ${strokes}画`;

    // 県名と数値を2行で置く。文字色は塗りの明るさに応じて白/黒を出し分ける。
    const b = box[ch];
    const cx = (b.x0 + b.x1 + 1) * 5, cy = (b.y0 + b.y1 + 1) * 5;
    const t = document.createElementNS(NS, "text");
    t.setAttribute("x", cx); t.setAttribute("y", cy);
    t.setAttribute("fill", cls.ink);
    t.innerHTML = `<tspan x="${cx}" dy="-0.15em">${shortName(pref.name)}</tspan>`
                + `<tspan x="${cx}" dy="1.1em">${strokes}</tspan>`;
    svgEl.appendChild(t);
  }

  document.getElementById("legend").innerHTML = CLASSES
    .map(c => `<span><i style="background:${c.color}"></i>${c.label}</span>`).join("");
});
</script>
</body>
</html>
